name: Gesture readout captures (fork QA only)
on:
  push:
    branches: [qa/5590-readout-captures]
permissions:
  contents: read
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: ./.github/actions/prepare-ffmpeg-bin
      - run: bash scripts/ci/install-workspace-dependencies.sh
      - name: Instrument existing edit-accuracy bench for required capture evidence
        run: |
          mkdir -p /tmp/readout/before /tmp/readout/after
          cp packages/studio/src/components/editor/DomEditOverlay.tsx /tmp/readout/after-overlay.tsx
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/studio/tests/e2e/edit-accuracy/case.mjs')
          s=p.read_text()
          needle='  const rec = await recording(ctx.page, false);\n  const smooth = smoothness(rec);\n  await ctx.page.mouse.up();'
          replacement='''  const readout = await ctx.page.evaluate(() => {
              const label=document.querySelector('[data-dom-edit-gesture-readout]');
              const rect=label?.getBoundingClientRect();
              const iframe=document.querySelector('iframe');
              return { text:label?.textContent ?? null, display:label ? getComputedStyle(label).display : 'absent',
                inside:rect ? rect.left >= 0 && rect.top >= 0 && rect.right <= innerWidth && rect.bottom <= innerHeight : false,
                inPreview:Boolean(iframe?.contentDocument?.querySelector('[data-dom-edit-gesture-readout]')) };
            });
            const phase=process.env.READOUT_PHASE;
            await ctx.page.screenshot({ path:`/tmp/readout/${phase}/${gesture}.jpg`, type:'jpeg', quality:85 });
            console.log('READOUT_EVIDENCE', phase, gesture, JSON.stringify(readout));
            if (phase === 'after' && (readout.display === 'none' || !readout.text || !readout.inside || readout.inPreview))
              throw new Error('Active readout is absent, clipped or inside the preview');
            if (phase === 'before' && readout.display !== 'absent') throw new Error('Baseline unexpectedly has a readout');
            const rec = await recording(ctx.page, false);
            const smooth = smoothness(rec);
            await ctx.page.mouse.up();
            await nextFrame(ctx.page, 3);
            if (phase === 'after' && await ctx.page.evaluate(() => {
              const label=document.querySelector('[data-dom-edit-gesture-readout]');
              return label && getComputedStyle(label).display !== 'none';
            })) throw new Error('Readout remains after pointerup');'''
          if needle not in s: raise SystemExit('Official bench seam changed')
          p.write_text(s.replace(needle,replacement))
          PY
      - name: Build exact baseline overlay and capture real gestures
        run: |
          git show a59a422195602b16825e56c85a7abc9f1147ef06:packages/studio/src/components/editor/DomEditOverlay.tsx > packages/studio/src/components/editor/DomEditOverlay.tsx
          bun run build
          node packages/cli/dist/cli.js browser ensure
          READOUT_PHASE=before bun run --cwd packages/studio test:edit-accuracy -- --grid pr --filter '^(move|resize|rotate)-none-px-r0-root-z100$' --jobs 1 --out /tmp/readout/before-results
      - name: Build candidate overlay and capture real gestures
        if: always()
        run: |
          cp /tmp/readout/after-overlay.tsx packages/studio/src/components/editor/DomEditOverlay.tsx
          bun run --cwd packages/studio build
          cp -R packages/studio/dist/. packages/cli/dist/studio/
          READOUT_PHASE=after bun run --cwd packages/studio test:edit-accuracy -- --grid pr --filter '^(move|resize|rotate)-none-px-r0-root-z100$' --jobs 1 --out /tmp/readout/after-results
      - name: Issue-required readout regressions
        if: always()
        run: bun run --cwd packages/studio test src/components/editor/DomEditGestureReadout.test.tsx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gesture-readout-before-after
          path: /tmp/readout
          retention-days: 7
