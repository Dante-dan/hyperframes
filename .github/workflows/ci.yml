name: HDR regression scene-mask diagnosis (fork only)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  HYPERFRAMES_NO_TELEMETRY: "1"
jobs:
  official-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: heygen-com/hyperframes
          ref: 7555024250ea93aabda0ae53cfa432b9c50e526c
          fetch-depth: 0
          lfs: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Compare exact failing merge with its base using repository harness
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hdr-validation"
          result=0
          for revision in d1b3471325bc7a9b080ef317afe7c462e54613c3 7555024250ea93aabda0ae53cfa432b9c50e526c; do
            git checkout "$revision"
            git lfs checkout
            evidence="$RUNNER_TEMP/hdr-validation/$revision"
            mkdir -p "$evidence"
            git rev-parse HEAD > "$evidence/source-sha.txt"
            python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/producer/src/services/render/stages/captureHdrFrameShared.ts')
          source = path.read_text()
          marker = '  const domPng = await timeHdrPhaseAsync(hdrPerf, "domScreenshotMs", () =>'
          diagnostic = '''  if (frameIdx >= 170) {
            log.info("[DEBUG-hf6433] transition scene mask", {
              frameIdx, time, sceneIds: [...sceneIds], showIds, hideIds,
              stacking: stackingInfo.map(({id, isHdr, opacity, visible, renderFrameVisible, zIndex}) =>
                ({id, isHdr, opacity, visible, renderFrameVisible, zIndex})),
              maskedDom: await session.page.evaluate(() =>
                [...document.querySelectorAll("[id], [data-hf-render-id]")].filter((node) =>
                  !["SCRIPT", "STYLE", "LINK", "META"].includes(node.tagName)).map((node) => ({
                    id: node.id, renderId: node.getAttribute("data-hf-render-id"),
                    visibility: getComputedStyle(node).visibility,
                    opacity: getComputedStyle(node).opacity,
                  }))),
            });
          }
          '''
          assert source.count(marker) == 1
          path.write_text(source.replace(marker, diagnostic + marker))
          PY
            sha256sum Dockerfile.test packages/producer/tests/hdr-regression/output/output.mp4 > "$evidence/input-sha256.txt"
            docker buildx build --load --tag hyperframes-producer:test --file Dockerfile.test . 2>&1 | tee "$evidence/build.txt"
            docker image inspect hyperframes-producer:test --format '{{.Id}}' > "$evidence/image-id.txt"
            set +e
            docker run --rm --security-opt seccomp=unconfined --shm-size=4g -e HYPERFRAMES_NO_TELEMETRY=1 -v "$PWD/packages/producer/tests:/app/packages/producer/tests" hyperframes-producer:test --mode=in-process hdr-regression 2>&1 | tee "$evidence/regression.txt"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$evidence/exit-code.txt"
            if [ "$status" -ne 0 ]; then result=1; fi
            if [ -d packages/producer/tests/hdr-regression/failures ]; then
              cp -R packages/producer/tests/hdr-regression/failures "$evidence/"
              rm -r packages/producer/tests/hdr-regression/failures
            fi
            sha256sum packages/producer/tests/hdr-regression/output/output.mp4 > "$evidence/golden-after-sha256.txt"
            git restore packages/producer/src/services/render/stages/captureHdrFrameShared.ts
          done
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hdr-regression-base-merge-comparison
          path: ${{ runner.temp }}/hdr-validation/
          if-no-files-found: error
